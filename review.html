<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Review - Dr. Naeem Shaikh Chiropractor</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --primary-light: #ccfbf1;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        body.dark-mode {
            --bg: #0b1120;
            --card-bg: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary-light: rgba(15, 118, 110, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px 16px 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        body.dark-mode .brand-badge {
            color: #2dd4bf;
        }

        .page-title {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .page-subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        /* Review Form Card */
        .review-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 26px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--bg);
            color: var(--text-dark);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
        }

        .form-textarea {
            resize: vertical;
            min-height: 95px;
        }

        /* Star Rating Input */
        .star-rating-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .stars-container {
            display: flex;
            gap: 6px;
            font-size: 1.6rem;
            cursor: pointer;
        }

        .star-item {
            color: #cbd5e1;
            transition: color 0.15s, transform 0.15s;
        }

        .star-item.active {
            color: var(--accent);
        }

        .star-item:hover {
            transform: scale(1.15);
        }

        .rating-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            margin-left: 6px;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #0d9488 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(15, 118, 110, 0.25);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(15, 118, 110, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Success Message */
        .success-banner {
            display: none;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 0.92rem;
            animation: fadeIn 0.3s ease;
        }

        body.dark-mode .success-banner {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(52, 211, 153, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Published Reviews Section */
        .reviews-feed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .reviews-feed-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .google-verified-pill {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        body.dark-mode .google-verified-pill {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Review Item Card */
        .review-post-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease;
            position: relative;
        }

        .review-post-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .reviewer-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .reviewer-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #0d9488 100%);
            color: white;
            font-weight: 800;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(15, 118, 110, 0.2);
            flex-shrink: 0;
        }

        .reviewer-info {
            flex-grow: 1;
        }

        .reviewer-name {
            font-size: 0.98rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verified-badge {
            color: #0284c7;
            font-size: 0.85rem;
        }

        .reviewer-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .review-stars-row {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 0.92rem;
        }

        .review-post-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 8px;
        }

        .review-post-text {
            font-size: 0.92rem;
            line-height: 1.55;
            color: var(--text-dark);
            white-space: pre-line;
        }

        .treatment-tag {
            display: inline-block;
            margin-top: 10px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
        }

        body.dark-mode .treatment-tag {
            color: #2dd4bf;
        }

        .delete-review-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s;
        }

        .delete-review-btn:hover {
            color: #ef4444;
        }

        .empty-feed {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.92rem;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px dashed var(--border);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .nav-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="page-header">
            <div class="brand-badge"><i class="fas fa-heartbeat"></i> Bodycare Chiropractic Centre</div>
            <h1 class="page-title">Patient Review & Feedback</h1>
            <p class="page-subtitle">Share your recovery experience with Dr. Naeem Shaikh</p>
        </header>

        <!-- Success Banner -->
        <div id="successBanner" class="success-banner">
            <i class="fas fa-check-circle"></i> Thank you! Your review has been published live.
        </div>

        <!-- Form Card -->
        <div class="review-card">
            <form id="reviewForm">
                <div class="form-group">
                    <label class="form-label" for="patientName">Patient Full Name *</label>
                    <input type="text" id="patientName" class="form-input" placeholder="e.g. Rahul Patil" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="patientCity">City / Location</label>
                    <input type="text" id="patientCity" class="form-input" placeholder="e.g. CIDCO, Aurangabad" value="Aurangabad">
                </div>

                <div class="form-group">
                    <label class="form-label" for="treatmentType">Treatment Received *</label>
                    <select id="treatmentType" class="form-select" required>
                        <option value="Sciatica & Leg Pain Relief">Sciatica & Leg Pain Relief</option>
                        <option value="Lower Back Pain Alignment">Lower Back Pain Alignment</option>
                        <option value="Slip Disc Decompression">Slip Disc Decompression</option>
                        <option value="Cervical & Neck Pain">Cervical & Neck Pain</option>
                        <option value="Frozen Shoulder Mobility">Frozen Shoulder Mobility</option>
                        <option value="Full Spine Adjustment">Full Spine Adjustment</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Your Rating *</label>
                    <div class="star-rating-wrap">
                        <div class="stars-container" id="starsContainer">
                            <i class="fas fa-star star-item active" data-rating="1"></i>
                            <i class="fas fa-star star-item active" data-rating="2"></i>
                            <i class="fas fa-star star-item active" data-rating="3"></i>
                            <i class="fas fa-star star-item active" data-rating="4"></i>
                            <i class="fas fa-star star-item active" data-rating="5"></i>
                        </div>
                        <span class="rating-label" id="ratingLabel">5.0 / 5.0 (Excellent)</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reviewMessage">Your Review / Experience *</label>
                    <textarea id="reviewMessage" class="form-textarea" placeholder="Describe how Dr. Naeem helped you get relief from pain..." required></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Publish My Review
                </button>
            </form>
        </div>

        <!-- Published Reviews Feed (Local Device) -->
        <div class="reviews-feed-header">
            <h2 class="reviews-feed-title">
                <i class="fab fa-google" style="color: #ea4335;"></i> Verified Patient Reviews
            </h2>
            <span class="google-verified-pill">
                <i class="fas fa-shield-alt" style="color: #10b981;"></i> Google Rating 4.9★
            </span>
        </div>

        <div id="reviewsFeed" class="feed-container">
            <!-- Reviews will be rendered here dynamically from localStorage -->
        </div>

        <!-- Navigation Links -->
        <div class="nav-links">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Back to Homepage</a>
            <button id="clearReviewsBtn" class="nav-btn" style="cursor: pointer; background: transparent; color: #ef4444; border-color: rgba(239, 68, 68, 0.3);">
                <i class="fas fa-trash-alt"></i> Reset Local Reviews
            </button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'dr_naeem_local_patient_reviews';
        let currentRating = 5;

        // Star rating picker
        const stars = document.querySelectorAll('.star-item');
        const ratingLabel = document.getElementById('ratingLabel');
        const ratingTexts = {
            1: '1.0 / 5.0 (Poor)',
            2: '2.0 / 5.0 (Fair)',
            3: '3.0 / 5.0 (Good)',
            4: '4.0 / 5.0 (Very Good)',
            5: '5.0 / 5.0 (Excellent)'
        };

        stars.forEach(star => {
            star.addEventListener('click', () => {
                const rating = parseInt(star.getAttribute('data-rating'));
                currentRating = rating;
                updateStars(rating);
            });
        });

        function updateStars(rating) {
            stars.forEach(star => {
                const r = parseInt(star.getAttribute('data-rating'));
                if (r <= rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
            ratingLabel.textContent = ratingTexts[rating] || `${rating}.0 / 5.0`;
        }

        // Load reviews from localStorage
        function getReviews() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : [];
            } catch(e) {
                return [];
            }
        }

        function saveReviews(reviews) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
        }

        function renderFeed() {
            const feed = document.getElementById('reviewsFeed');
            const reviews = getReviews();

            if (!reviews || reviews.length === 0) {
                feed.innerHTML = `
                    <div class="empty-feed">
                        <i class="fas fa-comment-dots" style="font-size: 2rem; margin-bottom: 8px; color: #94a3b8; display: block;"></i>
                        No local reviews added yet. Fill the form above to add your test review!
                    </div>
                `;
                return;
            }

            feed.innerHTML = '';
            reviews.forEach((item, index) => {
                const initial = item.name ? item.name.charAt(0).toUpperCase() : 'P';
                const card = document.createElement('div');
                card.className = 'review-post-card';
                
                let starsHtml = '';
                for (let i = 1; i <= 5; i++) {
                    starsHtml += `<i class="fas fa-star" style="color: ${i <= item.rating ? '#f59e0b' : '#cbd5e1'};"></i>`;
                }

                card.innerHTML = `
                    <button class="delete-review-btn" onclick="deleteReview(${index})" title="Delete review">&times;</button>
                    <div class="reviewer-meta">
                        <div class="reviewer-avatar">${initial}</div>
                        <div class="reviewer-info">
                            <div class="reviewer-name">
                                ${escapeHtml(item.name)} 
                                <i class="fas fa-check-circle verified-badge" title="Verified Patient"></i>
                            </div>
                            <div class="reviewer-sub">${escapeHtml(item.city || 'Aurangabad')} &bull; Verified Review</div>
                        </div>
                    </div>
                    <div class="review-stars-row">
                        ${starsHtml}
                        <span class="review-post-time">${escapeHtml(item.time || 'Recently')}</span>
                    </div>
                    <div class="review-post-text">${escapeHtml(item.message)}</div>
                    ${item.treatment ? `<span class="treatment-tag"><i class="fas fa-bone"></i> ${escapeHtml(item.treatment)}</span>` : ''}
                `;
                feed.appendChild(card);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.deleteReview = function(index) {
            const reviews = getReviews();
            reviews.splice(index, 1);
            saveReviews(reviews);
            renderFeed();
        };

        // Form Submission
        const form = document.getElementById('reviewForm');
        const submitBtn = document.getElementById('submitBtn');
        const successBanner = document.getElementById('successBanner');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('patientName').value.trim();
            const city = document.getElementById('patientCity').value.trim();
            const treatment = document.getElementById('treatmentType').value;
            const message = document.getElementById('reviewMessage').value.trim();

            if (!name || !message) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publishing...';

            setTimeout(() => {
                const reviews = getReviews();
                const newReview = {
                    id: Date.now(),
                    name: name,
                    city: city || 'Aurangabad',
                    treatment: treatment,
                    rating: currentRating,
                    message: message,
                    time: 'Just now'
                };

                reviews.unshift(newReview);
                saveReviews(reviews);

                // Reset form
                form.reset();
                currentRating = 5;
                updateStars(5);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Publish My Review';

                // Show success
                successBanner.style.display = 'block';
                setTimeout(() => {
                    successBanner.style.display = 'none';
                }, 4000);

                renderFeed();
            }, 600);
        });

        // Reset all reviews button
        document.getElementById('clearReviewsBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to clear all test reviews from this device?')) {
                localStorage.removeItem(STORAGE_KEY);
                renderFeed();
            }
        });

        // Sync dark mode from site if set
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        renderFeed();
    </script>
</body>
</html>
